name: Supabase Migrations

on:
  workflow_run:
    workflows:
      - Ardore CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending migrations to the linked production project
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      vars.SUPABASE_MIGRATIONS_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link production project
        run: ./node_modules/.bin/supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Detect pending migrations
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          if ! dry_run_output="$(./node_modules/.bin/supabase db push --linked --dry-run 2>&1)"; then
            echo "Supabase migration dry run failed; no migrations were applied." >&2
            exit 1
          fi

          if grep -Fq "Remote database is up to date" <<<"$dry_run_output"; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pending=false
          while IFS= read -r migration; do
            if grep -Fq -- "${migration##*/}" <<<"$dry_run_output"; then
              pending=true
              break
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print)

          if [[ "$pending" != true ]]; then
            echo "Unable to determine pending migrations from the Supabase CLI dry run." >&2
            exit 1
          fi

          echo "pending=true" >> "$GITHUB_OUTPUT"

      - name: Apply pending migrations
        if: steps.migrations.outputs.pending == 'true'
        run: ./node_modules/.bin/supabase db push --linked --yes

      - name: No pending migrations
        if: steps.migrations.outputs.pending == 'false'
        run: echo "No pending Supabase migrations; nothing to apply."
