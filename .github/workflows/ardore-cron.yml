name: Ardore scheduled cron jobs

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: 'Run all jobs or only coaching payment recovery'
        type: choice
        default: all
        options:
          - all
          - coaching-payments

permissions:
  contents: read

jobs:
  call-cron-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARDORE_BASE_URL: ${{ vars.ARDORE_BASE_URL }}
    steps:
      - name: Check out recovery runner
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Recover coaching payment reservations and refunds
        id: recovery
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: node scripts/run-coaching-recovery.mjs

      - name: Diagnose network after recovery failure
        if: failure() && steps.recovery.outcome == 'failure'
        run: node scripts/diagnose-recovery-network.mjs

      - name: Call session cron endpoints
        if: (github.event_name == 'workflow_dispatch' && inputs.target != 'coaching-payments') || github.event.schedule == '0 8 * * *'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${ARDORE_BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${base_url}/api/cron/session-reminders"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${base_url}/api/cron/session-review-prompts"

      - name: Call verification cleanup endpoint
        if: (github.event_name == 'workflow_dispatch' && inputs.target != 'coaching-payments') || github.event.schedule == '0 9 * * *'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${ARDORE_BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${base_url}/api/cron/cleanup-verification-docs"
