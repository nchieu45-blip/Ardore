name: Ardore scheduled cron jobs

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: 'Run all jobs or only coaching payment recovery'
        type: choice
        default: all
        options:
          - all
          - coaching-payments

permissions:
  contents: read

jobs:
  call-cron-endpoints:
    runs-on: ubuntu-latest
    # Recovery has its own bounded retries; leave time for independent email jobs
    # even when recovery and its diagnostics exhaust their request budgets.
    timeout-minutes: 10
    env:
      ARDORE_BASE_URL: ${{ vars.ARDORE_BASE_URL }}
    steps:
      - name: Validate cron configuration
        id: configuration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ARDORE_BASE_URL%/}" != 'https://www.ardore-health.com' ]]; then
            echo '::error::ARDORE_BASE_URL must be the canonical HTTPS production origin.'
            exit 1
          fi
          if [[ -z "${CRON_SECRET:-}" || ${#CRON_SECRET} -gt 4096 || "$CRON_SECRET" == *$'\r'* || "$CRON_SECRET" == *$'\n'* ]]; then
            echo '::error::CRON_SECRET is missing or invalid.'
            exit 1
          fi

      - name: Check out recovery runner
        id: checkout
        if: ${{ !cancelled() && steps.configuration.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *') }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Recover coaching payment reservations and refunds
        id: recovery
        if: ${{ !cancelled() && steps.configuration.outcome == 'success' && steps.checkout.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: node scripts/run-coaching-recovery.mjs

      - name: Diagnose network after recovery failure
        if: failure() && steps.recovery.outcome == 'failure'
        run: node scripts/diagnose-recovery-network.mjs

      - name: Call session reminders endpoint
        id: reminders
        if: ${{ !cancelled() && steps.configuration.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.target != 'coaching-payments') || github.event.schedule == '*/10 * * * *') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(printf 'Authorization: Bearer %s\n' "$CRON_SECRET" | env -u CRON_SECRET curl \
            --disable --silent --proto '=https' --connect-timeout 10 --max-time 60 \
            --header @- --output /dev/null --write-out '%{http_code}' \
            "${ARDORE_BASE_URL%/}/api/cron/session-reminders")" || {
              echo '::error::Session reminders request failed.'; exit 1;
            }
          [[ "$status" =~ ^2[0-9]{2}$ ]] || { echo "::error::Session reminders returned HTTP $status."; exit 1; }

      - name: Call session review prompts endpoint
        id: review-prompts
        if: ${{ !cancelled() && steps.configuration.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.target != 'coaching-payments') || github.event.schedule == '*/10 * * * *') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(printf 'Authorization: Bearer %s\n' "$CRON_SECRET" | env -u CRON_SECRET curl \
            --disable --silent --proto '=https' --connect-timeout 10 --max-time 60 \
            --header @- --output /dev/null --write-out '%{http_code}' \
            "${ARDORE_BASE_URL%/}/api/cron/session-review-prompts")" || {
              echo '::error::Session review prompts request failed.'; exit 1;
            }
          [[ "$status" =~ ^2[0-9]{2}$ ]] || { echo "::error::Session review prompts returned HTTP $status."; exit 1; }

      - name: Call verification cleanup endpoint
        id: cleanup
        if: ${{ !cancelled() && steps.configuration.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.target != 'coaching-payments') || github.event.schedule == '0 9 * * *') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(printf 'Authorization: Bearer %s\n' "$CRON_SECRET" | env -u CRON_SECRET curl \
            --disable --silent --proto '=https' --connect-timeout 10 --max-time 60 \
            --header @- --output /dev/null --write-out '%{http_code}' \
            "${ARDORE_BASE_URL%/}/api/cron/cleanup-verification-docs")" || {
              echo '::error::Verification cleanup request failed.'; exit 1;
            }
          [[ "$status" =~ ^2[0-9]{2}$ ]] || { echo "::error::Verification cleanup returned HTTP $status."; exit 1; }
